# Prompt Starship aux couleurs Tokyo Night, palette par défaut du profil.
# Les glyphes exigent JetBrainsMono Nerd Font, installée par install-desktop.sh.

format = """
[](fg:#7aa2f7)\
$os\
$username\
[](bg:#414868 fg:#7aa2f7)\
$directory\
[](fg:#414868 bg:#565f89)\
$git_branch\
$git_status\
[](fg:#565f89 bg:#24283b)\
$python\
$nodejs\
$rust\
$golang\
[](fg:#24283b bg:#1a1b26)\
$docker_context\
$cmd_duration\
[ ](fg:#1a1b26)\
$line_break\
$character"""

add_newline = true

[os]
disabled = false
style = "bg:#7aa2f7 fg:#1a1b26"

[os.symbols]
Ubuntu = " "
Linux = " "

[username]
show_always = true
style_user = "bg:#7aa2f7 fg:#1a1b26"
style_root = "bg:#f7768e fg:#1a1b26 bold"
format = '[ $user ]($style)'

[hostname]
ssh_only = true
style = "bg:#7aa2f7 fg:#1a1b26"
format = '[@$hostname ]($style)'

[directory]
style = "bg:#414868 fg:#c0caf5"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"
read_only = "  "

[directory.substitutions]
"Documents" = " "
"Downloads" = " "
"Music" = " "
"Pictures" = " "

[git_branch]
symbol = ""
style = "bg:#565f89 fg:#c0caf5"
format = '[ $symbol $branch ]($style)'

[git_status]
style = "bg:#565f89 fg:#e0af68"
format = '[$all_status$ahead_behind ]($style)'

[python]
symbol = " "
style = "bg:#24283b fg:#7dcfff"
format = '[ $symbol($version) ]($style)'

[nodejs]
symbol = " "
style = "bg:#24283b fg:#9ece6a"
format = '[ $symbol($version) ]($style)'

[rust]
symbol = " "
style = "bg:#24283b fg:#ff9e64"
format = '[ $symbol($version) ]($style)'

[golang]
symbol = " "
style = "bg:#24283b fg:#7dcfff"
format = '[ $symbol($version) ]($style)'

[docker_context]
symbol = " "
style = "bg:#1a1b26 fg:#7dcfff"
format = '[ $symbol$context ]($style)'

[cmd_duration]
min_time = 2000
style = "bg:#1a1b26 fg:#e0af68"
format = '[  $duration ]($style)'

[character]
success_symbol = "[❯](bold #9ece6a)"
error_symbol = "[❯](bold #f7768e)"
vimcmd_symbol = "[❮](bold #bb9af7)"
